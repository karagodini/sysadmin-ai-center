[server]
address = "127.0.0.1"
port = 8501
headless = true
runOnSave = false
fileWatcherType = "none"
enableCORS = true
corsAllowedOrigins = ["https://ai.ikaragodin.com.ru"]
allowedHosts = ["ai.ikaragodin.com.ru", "localhost", "127.0.0.1"]
enableXsrfProtection = true
maxUploadSize = 5

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#6366f1"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"
